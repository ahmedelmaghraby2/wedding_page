<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ahmed & Aya Wedding Invitation - Share our joy on this special day.">
  <meta name="theme-color" content="#FAF7F2">

  <!-- Open Graph meta tags (update per couple when creating a new site) -->
  <meta property="og:title" content="Ahmed & Aya Wedding Invitation">
  <meta property="og:description" content="We invite you to share in our joy on this special day - Ahmed & Aya Wedding">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/assets/weddings/ahmed-aya/hero.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed & Aya Wedding">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <title>Ahmed & Aya Wedding Invitation</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF7F2;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #boot-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #boot-loader .ring {
      width: 42px;
      height: 42px;
      border: 3px solid #EDE4D8;
      border-top-color: #A8863F;
      border-radius: 50%;
      animation: boot-spin 1s linear infinite;
    }

    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="boot-loader" aria-hidden="true"><div class="ring"></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-loader');
      if (!el) return;
      el.classList.add('hidden');
      window.setTimeout(function () { el.remove(); }, 450);
    });
  </script>
</body>

</html>
